[Mouse]
; ---- mouse mode ----
; MouseMode=1 "native" (default): in gameplay with a pad connected, the mouse (= Steam gyro-as-mouse)
;   is passed to the game's own mouse-look path (engine patch P1 removes the "pad mode ignores
;   mouse" gate). Nothing is injected into the right stick. While the real right stick is pushed
;   past StickOverride the mouse X/Y is removed from the game (the game would otherwise use the
;   mouse INSTEAD of the stick), so the stick always wins; the mouse returns when it is released.
;   In native mode the gyro speed is set by: Steam gyro sensitivity, NativeSensitivity (below)
;   and the in-game mouse sensitivity. Sensitivity, SensitivityY, Smoothing*, Curve, DeadzoneComp
;   apply ONLY to MouseMode=0. InvertY works in both modes.
; MouseMode=0 "stick": the old behaviour, mouse -> right stick mixing (Sensitivity, Smoothing, ...).
; Menus are unaffected by the mode (see MenuMouse). Hot reload and ModeKey can switch the mode;
; switching to 1 only works if patch P1 was applied at startup (see xinput_mouse.log).
MouseMode=1
; MouseMode=1 only: extra multiplier on mouse X/Y counts given to the game (1.0 = untouched).
; Fractions are carried over so tiny movements are not lost.
NativeSensitivity=1.0
; MouseMode=1 only: distance-preserving smoothing of the mouse counts given to the game. Steam
;   delivers gyro-as-mouse counts unevenly relative to game frames (e.g. 1,20,4,15 per frame during
;   a steady pan), which judders the camera. Counts are buffered and released each poll as
;   pending * (1 - exp(-dt/tau)); fractions are carried, so the total distance is exactly conserved
;   (motion is only delayed by about tau). Applied after NativeSensitivity / InvertY. Hot reload ok.
; NativeSmoothingMs: tau in ms. 0 = off (counts pass through as before). Default 35; useful 8-40.
NativeSmoothingMs=35
; NativeSmoothingMaxSpeed: counts/s. 0 = smooth at all speeds. >0 = full smoothing below this
;   speed, none above 2x this speed (tau scales down linearly in between), so fast flicks stay instant.
;   Default 1500 (try 400-1500). Speed is an EMA (50 ms) of |counts|/dt per axis.
NativeSmoothingMaxSpeed=1500
; NativeFrameLocked: 1 (default) = release once per DISPLAYED frame: factor = 1 - exp(-NativeFrameMs/tau),
;   independent of the moment the game polls the mouse. The game polls exactly once per vsync'd frame but
;   the poll time jitters inside the frame (measured gaps like 4.8, 26.6, 3.3 ms); releasing by measured dt
;   gives every frame a different share of motion = visible chop. A second poll < 1 ms after the previous
;   one counts as the same frame: its input is buffered, 0 is emitted (counted as "dups" in the LogLevel 2
;   summary). NativeSmoothingMaxSpeed then uses counts per nominal frame / NativeFrameMs.
;   0 = old behaviour, release by measured time between polls. Hot reload ok.
NativeFrameLocked=1
; NativeFrameMs: nominal frame time in ms for NativeFrameLocked (clamped 4-50). 16.667 = 60 fps.
NativeFrameMs=16.667
; Virtual-key code that toggles MouseMode at runtime (0 = off). Example: 119 = F8.
ModeKey=0

; ---- engine patches (applied ONCE at game start: changing these needs a game RESTART;
;      a hot reload of this file does not apply or undo them) ----
; LinearMouse: 1 = make the game's native mouse-look speed curve linear (removes the low-speed
;   damping, so slow gyro movements are not squashed). 0 = leave the game's curve.
LinearMouse=1
; StickLinear: 1 = make the REAL right stick linear too (no 0.3 dead zone, no squared response,
;   no pitch snap, no yaw ramp acceleration). 0 (default) = original game stick feel.
;   Independent of MouseMode.
StickLinear=0

; 1 = mouse (gyro) handling on, 0 = off (mouse passes through untouched).
; Handling is also off automatically while no gamepad is connected.
Enabled=1

; ---- aim response, MouseMode=0 only (gameplay only) ----
; Mouse speed to stick: 1.0 = about 1000 mouse counts/s gives a fully pushed stick.
Sensitivity=0.3
; Extra multiplier for vertical aim.
SensitivityY=1.0
; 0 = mouse up looks up. 1 = inverted (mouse down looks up).
InvertY=0
; Response curve: 1.0 = linear, <1 = small moves stronger, >1 = small moves finer.
Curve=1.0
; Fraction of stick range added so small moves get past the game's pad dead zone (0.0 - 0.3).
DeadzoneComp=0.10
; How mouse speed is estimated:
; 1 = (default) exponential smoothing updated on every game poll of the pad; fluid even
;     when the gyro only produces a few mouse counts per poll.
; 0 = classic: counts summed over a sliding window.
SmoothingMode=1
; Mode 1: smoothing time constant in ms (1-500). Higher = steadier/laggier, lower = snappier.
; Mode 0: window length in ms (5-200; 30 was the old default).
SmoothingMs=20
; The real right stick always wins: once pushed past this fraction (0-1), mouse
; motion is ignored (and discarded) until the stick returns below it. Used in both modes.
StickOverride=0.27

; ---- menus ----
; Menu = front-end cursor flag or pause flag set (see xinput_mouse.log "menu state").
; The mouse is never mixed into the stick in menus.
; 0 = mouse X/Y is removed from the game in menus (cursor stays put, pad navigates).
; 1 = the mouse reaches the game natively in menus (cursor moves).
MenuMouse=0
; 1 = the engine's pause flag counts as "menu" too. Set 0 if the log shows
; paused=1 during normal gameplay (then only the front-end cursor flag is used).
UsePauseFlag=1

; ---- press-start screen ----
; 1 (default) = while the game's "controller locked" flag is 0 (press-start / splash screen, also after
;     quit-to-start-screen), a pad is connected and Enabled=1: ALL mouse data (X, Y, wheel, buttons) is
;     removed from the game, so Steam gyro-as-mouse cannot claim the controller and switch the game to
;     keyboard mode. Keyboard is untouched. 0 = off. Hot reload ok.
StripMouseOnStart=1

; ---- mouse buttons ----
; 0 = mouse buttons reach the game natively.
; 1 = in gameplay: left button -> right trigger, right button -> left trigger,
;     middle button -> right bumper, and the game no longer sees those buttons.
MouseButtons=0

; ---- hotkeys (only while the game window is focused) ----
; Virtual-key codes, 0 = off. Examples: 80 = P, 75 = K, 76 = L, 121 = F10.
; ToggleKey: mouse handling on/off.  SlowerKey / FasterKey: Sensitivity -10% / +10% (saved here; Sensitivity is used by MouseMode=0 only).
ToggleKey=0
SlowerKey=0
FasterKey=0

; ---- diagnostics (xinput_mouse.log next to the DLL) ----
; 0 = load / install problems only
; 1 = + install details, first-call info, menu transitions, pad connect changes
; 2 = + summary every ~5 s (mode, native passed/stripped counts, stickBusy, pad state, mouse velocity, injected stick, counts)
; 3 = + per-poll gameplay trace to xinput_trace.csv (t_ms, dt_ms, raw_dx, raw_dy, velX, velY,
;     realRX, realRY, outRX, outRY, menu); capped at ~20 MB, rewritten each game start.
; In MouseMode=1 level 3 also writes xinput_native.csv: one row per mouse poll with QPC time (t_ms, 0.1 ms),
; dt_ms (measured), in_dx/in_dy (after sensitivity/invert), out_dx/out_dy (given to the game), pend_x/pend_y,
; frame_locked (NativeFrameLocked in effect).
; This file is re-read about once per second while the game runs (see "settings reloaded"
; in xinput_mouse.log), so Sensitivity, Smoothing*, Curve etc. can be tuned live.
LogLevel=1
