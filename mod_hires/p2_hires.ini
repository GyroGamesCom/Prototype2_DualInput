; HiRes mod for Prototype 2 - resolution list (p2_hires.ini, next to prototype2.exe).
;
; The game has a fixed list of 14 resolutions. This mod replaces it with the list below.
; The game saves the CHOSEN POSITION in the list (not the size), so after installing or
; changing this list select your resolution in Options again once.
;
; A resolution is only offered in the menu if your display/driver also reports it
; (a 4K monitor, or NVIDIA DSR/DLDSR, or AMD VSR on a smaller monitor).
; Restart the game after editing. See p2_hires.log if something looks wrong.

[Resolutions]
; Auto=1 ignores Mode1..Mode14 and builds the list from the modes your display reports
; (all above 1920x1080, always including 1920x1080 and 3840x2160, filled up with common sizes).
Auto=0

; Exactly 14 entries, WIDTHxHEIGHT, allowed range 640x480 .. 7680x4320.
; They are sorted ascending automatically; duplicates/invalid entries are dropped and
; missing slots are filled with the original small resolutions (640x480, 800x600, ...).
Mode1=1280x720
Mode2=1280x800
Mode3=1280x1024
Mode4=1366x768
Mode5=1600x900
Mode6=1680x1050
Mode7=1920x1080
Mode8=1920x1200
Mode9=2560x1080
Mode10=2560x1440
Mode11=2560x1600
Mode12=3200x1800
Mode13=3440x1440
Mode14=3840x2160

[Display]
; Fullscreen refresh rate. Some 4K TVs list 24 Hz first for 3840x2160 and the game takes the
; first mode, locking it to 24 fps. The mod now picks the refresh rate itself.
; RefreshRate: 0 = highest available for the chosen size; otherwise that exact rate if the
; display offers it for the size (e.g. 60), else the highest.
RefreshRate=0
; MaxRefresh: 0 = no cap; e.g. 60 to never go above 60 Hz (avoids 120 Hz modes).
MaxRefresh=0
